; Peso de los archivos de los formularios (docs/DEPLOY.md § Peso de los archivos). PHP lo lee
; solo si en el hosting corre como CGI/FastCGI/FPM; si no, se ignora y quedan los 2 MB de fábrica.
; Vive aquí (api/) y no en la raíz del sitio: el deploy repone la raíz tal como sale del build.
; Después de cambiarlo, medir y recién entonces ajustar MAX_MB en src/data/formatos.ts.
upload_max_filesize = 10M
post_max_size = 32M
max_file_uploads = 10
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
