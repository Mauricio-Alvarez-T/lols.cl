name: Deploy lols.cl

# Pull-side: el FTP de cPanel bloquea las IPs de GitHub Actions (cPHulk). Este workflow
# solo compila y publica dist/ + scripts/ en la rama `deploy`; un cron en el servidor la
# baja con git y la copia al docroot (copia fijada de scripts/cpanel-deploy.sh, docs/DEPLOY.md).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Una obra real (src/content/obras) con un marcador de propuesta no sale al sitio.
      - name: Verificar obras reales
        run: node scripts/verificar-obras-reales.mjs

      # Commit de main que queda en línea: la Bóveda lo lee en /build.txt.
      - name: build.txt
        run: echo "$GITHUB_SHA" > dist/build.txt

      # Solo informa cuánto falta para producción (el build con SITE=https://lols.cl se cae en
      # el primer marcador, así que no sirve para contarlos).
      - name: Contar marcadores
        continue-on-error: true
        run: |
          contar() { grep -rhoE --include='*.html' "$1" dist | wc -l; }
          {
            echo "| Marcador | Apariciones |"
            echo "|---|---|"
            echo "| data-pendiente | $(contar 'data-pendiente=') |"
            echo "| pendiente (sin ejemplo) | $(contar 'class="([^"]* )?pendiente( [^"]*)?"') |"
            echo "| revisar | $(contar 'class="([^"]* )?revisar( [^"]*)?"') |"
            echo "| ejemplo | $(contar 'class="([^"]* )?ejemplo( [^"]*)?"') |"
            echo "| Referencial | $(contar 'class="([^"]* )?etiqueta-ref( [^"]*)?"') |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar rama deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "build: dist de ${GITHUB_SHA::7} [skip ci]" || echo "dist sin cambios"
          git push -f origin HEAD:deploy
